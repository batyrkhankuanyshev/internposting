name: Scan HK internships

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      - name: Scan careers sites and LinkedIn
        id: scan
        # scheduled runs carry no repository in github.event, so build the Pages URL from GITHUB_REPOSITORY
        run: SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" python scraper/run.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/feed.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update openings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      - name: Open an issue for new openings
        if: steps.scan.outputs.new_count != '0' && steps.scan.outputs.new_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.scan.outputs.issue_title }}
        run: |
          gh label create new-openings --color B4232C --description "New HK openings found by the scanner" --force
          gh issue create --title "$ISSUE_TITLE" --body-file new_jobs.md --label new-openings
